<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Happy Birthday Sean ♡</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap');

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    min-height:100vh;
    overflow:hidden;
    font-family:'DM Sans',sans-serif;
    color:white;

    background:
        radial-gradient(circle at 15% 20%, #59407d 0%, transparent 30%),
        radial-gradient(circle at 85% 15%, #8c496f 0%, transparent 28%),
        radial-gradient(circle at 50% 100%, #31536d 0%, transparent 35%),
        linear-gradient(135deg,#100d1d,#24182f,#17152c);

    display:flex;
    justify-content:center;
    align-items:center;
}

/* BACKGROUND GLOW */

.glow{
    position:fixed;
    width:280px;
    height:280px;
    border-radius:50%;
    filter:blur(90px);
    opacity:.28;
    pointer-events:none;
}

.glow.one{
    background:#d88bc5;
    top:-100px;
    left:-80px;
}

.glow.two{
    background:#7da7ff;
    right:-100px;
    bottom:-80px;
}

/* STARS */

.stars{
    position:fixed;
    inset:0;
    pointer-events:none;
    opacity:.65;

    background-image:
        radial-gradient(circle,#fff 1px,transparent 1px),
        radial-gradient(circle,#fff 1px,transparent 1px),
        radial-gradient(circle,#fff 1.5px,transparent 1.5px);

    background-size:
        90px 90px,
        140px 140px,
        220px 220px;

    background-position:
        20px 30px,
        70px 90px,
        120px 40px;

    animation:starsMove 18s linear infinite;
}

@keyframes starsMove{
    from{transform:translateY(0);}
    to{transform:translateY(-80px);}
}

/* DECOR */

.decor{
    position:fixed;
    pointer-events:none;
    font-size:25px;
    opacity:.75;
}

.d1{
    top:12%;
    left:10%;
    animation:float 4s ease-in-out infinite;
}

.d2{
    top:20%;
    right:9%;
    animation:float 5s ease-in-out infinite 1s;
}

.d3{
    bottom:14%;
    left:8%;
    animation:float 5s ease-in-out infinite 2s;
}

.d4{
    bottom:18%;
    right:10%;
    animation:float 4.5s ease-in-out infinite 1.5s;
}

@keyframes float{
    0%,100%{transform:translateY(0) rotate(-5deg);}
    50%{transform:translateY(-15px) rotate(7deg);}
}

/* MAIN */

.container{
    position:relative;
    z-index:5;
    width:100%;
    max-width:480px;
    padding:20px;
}

.card{
    position:relative;
    text-align:center;
    padding:32px 25px 28px;

    border-radius:35px;

    background:rgba(255,255,255,.085);
    border:1px solid rgba(255,255,255,.18);

    backdrop-filter:blur(25px);
    -webkit-backdrop-filter:blur(25px);

    box-shadow:
        0 30px 90px rgba(0,0,0,.45),
        inset 0 1px rgba(255,255,255,.15);

    animation:cardIn 1.2s ease;
}

@keyframes cardIn{
    from{
        opacity:0;
        transform:translateY(40px) scale(.94);
    }
    to{
        opacity:1;
        transform:translateY(0) scale(1);
    }
}

/* TOP */

.from{
    font-size:11px;
    letter-spacing:4px;
    text-transform:uppercase;
    color:#d9cde4;
    margin-bottom:13px;
}

.friend{
    display:inline-block;
    padding:8px 15px;
    border-radius:30px;

    background:rgba(255,255,255,.09);
    border:1px solid rgba(255,255,255,.13);

    color:#eee5f5;
    font-size:12px;
}

/* AGE */

.age{
    margin-top:15px;
    font-family:'Playfair Display',serif;
    font-size:25px;

    background:linear-gradient(
        90deg,
        #fff,
        #f0b9df,
        #b9c8ff,
        #fff
    );

    background-size:300%;
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;

    animation:shine 5s linear infinite;
}

@keyframes shine{
    from{background-position:0%;}
    to{background-position:300%;}
}

/* CAKE */

.cake-area{
    height:180px;
    position:relative;
    margin-top:5px;
}

/* candles */

.candles{
    position:absolute;
    left:50%;
    top:15px;
    transform:translateX(-50%);
    display:flex;
    gap:22px;
    z-index:4;
}

.candle{
    width:8px;
    height:35px;
    border-radius:5px;

    background:
        repeating-linear-gradient(
            -45deg,
            #f6b9d6 0 5px,
            #fff 5px 10px
        );

    position:relative;

    animation:candleDrop .8s ease both;
}

.candle:nth-child(2){
    animation-delay:.2s;
}

.candle:nth-child(3){
    animation-delay:.4s;
}

@keyframes candleDrop{
    from{
        transform:translateY(-50px);
        opacity:0;
    }
    to{
        transform:translateY(0);
        opacity:1;
    }
}

.flame{
    position:absolute;
    width:11px;
    height:16px;

    left:50%;
    top:-14px;

    transform:translateX(-50%);

    background:linear-gradient(#fff5a3,#ff9e5e);
    border-radius:50% 50% 50% 50%;

    box-shadow:
        0 0 10px #ffd978,
        0 0 22px #ffb45e;

    animation:flicker .7s infinite alternate;
}

@keyframes flicker{
    from{transform:translateX(-50%) scale(.9);}
    to{transform:translateX(-50%) scale(1.12);}
}

/* cake layers */

.cake{
    position:absolute;
    left:50%;
    bottom:8px;
    transform:translateX(-50%);
    width:245px;
    height:125px;
}

    bottom:
