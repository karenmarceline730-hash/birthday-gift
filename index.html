<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Happy Birthday Sean ♡</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap');

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    min-height:100vh;
    overflow:hidden;
    font-family:'DM Sans',sans-serif;
    color:white;

    background:
        radial-gradient(circle at 15% 20%, #59407d 0%, transparent 30%),
        radial-gradient(circle at 85% 15%, #8c496f 0%, transparent 28%),
        radial-gradient(circle at 50% 100%, #31536d 0%, transparent 35%),
        linear-gradient(135deg,#100d1d,#24182f,#17152c);

    display:flex;
    justify-content:center;
    align-items:center;
}

/* BACKGROUND GLOW */

.glow{
    position:fixed;
    width:280px;
    height:280px;
    border-radius:50%;
    filter:blur(90px);
    opacity:.28;
    pointer-events:none;
}

.glow.one{
    background:#d88bc5;
    top:-100px;
    left:-80px;
}

.glow.two{
    background:#7da7ff;
    right:-100px;
    bottom:-80px;
}

/* STARS */

.stars{
    position:fixed;
    inset:0;
    pointer-events:none;
    opacity:.65;

    background-image:
        radial-gradient(circle,#fff 1px,transparent 1px),
        radial-gradient(circle,#fff 1px,transparent 1px),
        radial-gradient(circle,#fff 1.5px,transparent 1.5px);

    background-size:
        90px 90px,
        140px 140px,
        220px 220px;

    background-position:
        20px 30px,
        70px 90px,
        120px 40px;

    animation:starsMove 18s linear infinite;
}

@keyframes starsMove{
    from{transform:translateY(0);}
    to{transform:translateY(-80px);}
}

/* DECOR */

.decor{
    position:fixed;
    pointer-events:none;
    font-size:25px;
    opacity:.75;
}

.d1{
    top:12%;
    left:10%;
    animation:float 4s ease-in-out infinite;
}

.d2{
    top:20%;
    right:9%;
    animation:float 5s ease-in-out infinite 1s;
}

.d3{
    bottom:14%;
    left:8%;
    animation:float 5s ease-in-out infinite 2s;
}

.d4{
    bottom:18%;
    right:10%;
    animation:float 4.5s ease-in-out infinite 1.5s;
}

@keyframes float{
    0%,100%{transform:translateY(0) rotate(-5deg);}
    50%{transform:translateY(-15px) rotate(7deg);}
}

/* MAIN */

.container{
    position:relative;
    z-index:5;
    width:100%;
    max-width:480px;
    padding:20px;
}

.card{
    position:relative;
    text-align:center;
    padding:32px 25px 28px;

    border-radius:35px;

    background:rgba(255,255,255,.085);
    border:1px solid rgba(255,255,255,.18);

    backdrop-filter:blur(25px);
    -webkit-backdrop-filter:blur(25px);

    box-shadow:
        0 30px 90px rgba(0,0,0,.45),
        inset 0 1px rgba(255,255,255,.15);

    animation:cardIn 1.2s ease;
}

@keyframes cardIn{
    from{
        opacity:0;
        transform:translateY(40px) scale(.94);
    }
    to{
        opacity:1;
        transform:translateY(0) scale(1);
    }
}

/* TOP */

.from{
    font-size:11px;
    letter-spacing:4px;
    text-transform:uppercase;
    color:#d9cde4;
    margin-bottom:13px;
}

.friend{
    display:inline-block;
    padding:8px 15px;
    border-radius:30px;

    background:rgba(255,255,255,.09);
    border:1px solid rgba(255,255,255,.13);

    color:#eee5f5;
    font-size:12px;
}

/* AGE */

.age{
    margin-top:15px;
    font-family:'Playfair Display',serif;
    font-size:25px;

    background:linear-gradient(
        90deg,
        #fff,
        #f0b9df,
        #b9c8ff,
        #fff
    );

    background-size:300%;
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;

    animation:shine 5s linear infinite;
}

@keyframes shine{
    from{background-position:0%;}
    to{background-position:300%;}
}

/* CAKE */

.cake-area{
    height:180px;
    position:relative;
    margin-top:5px;
}

/* candles */

.candles{
    position:absolute;
    left:50%;
    top:15px;
    transform:translateX(-50%);
    display:flex;
    gap:22px;
    z-index:4;
}

.candle{
    width:8px;
    height:35px;
    border-radius:5px;

    background:
        repeating-linear-gradient(
            -45deg,
            #f6b9d6 0 5px,
            #fff 5px 10px
        );

    position:relative;

    animation:candleDrop .8s ease both;
}

.candle:nth-child(2){
    animation-delay:.2s;
}

.candle:nth-child(3){
    animation-delay:.4s;
}

@keyframes candleDrop{
    from{
        transform:translateY(-50px);
        opacity:0;
    }
    to{
        transform:translateY(0);
        opacity:1;
    }
}

.flame{
    position:absolute;
    width:11px;
    height:16px;

    left:50%;
    top:-14px;

    transform:translateX(-50%);

    background:linear-gradient(#fff5a3,#ff9e5e);
    border-radius:50% 50% 50% 50%;

    box-shadow:
        0 0 10px #ffd978,
        0 0 22px #ffb45e;

    animation:flicker .7s infinite alternate;
}

@keyframes flicker{
    from{transform:translateX(-50%) scale(.9);}
    to{transform:translateX(-50%) scale(1.12);}
}

/* cake layers */

.cake{
    position:absolute;
    left:50%;
    bottom:8px;
    transform:translateX(-50%);
    width:245px;
    height:125px;
}

/* plate */

.plate{
    position:absolute;
    bottom:0;
    left:50%;
    transform:translateX(-50%);

    width:275px;
    height:20px;

    border-radius:50%;

    background:linear-gradient(#eee,#aaa);
    box-shadow:0 7px 15px rgba(0,0,0,.3);
}

/* layer */

.layer{
    position:absolute;
    left:50%;
    transform:translateX(-50%);

    border-radius:15px 15px 10px 10px;

    box-shadow:
        inset 0 -7px 0 rgba(0,0,0,.08),
        0 5px 10px rgba(0,0,0,.15);
}

.layer.bottom{
    bottom:16px;
    width:225px;
    height:48px;

    background:linear-gradient(135deg,#c879a9,#e6a9ca);

    animation:layerBottom .8s ease both;
}

.layer.middle{
    bottom:58px;
    width:190px;
    height:43px;

    background:linear-gradient(135deg,#8e78c4,#b7a6e8);

    animation:layerMiddle 1s ease .5s both;
}

.layer.top{
    bottom:95px;
    width:150px;
    height:38px;

    background:linear-gradient(135deg,#f0b6d3,#ffd5e5);

    animation:layerTop 1s ease 1s both;
}

@keyframes layerBottom{
    from{
        opacity:0;
        transform:translateX(-50%) translateY(-80px);
    }
    to{
        opacity:1;
        transform:translateX(-50%) translateY(0);
    }
}

@keyframes layerMiddle{
    from{
        opacity:0;
        transform:translateX(-50%) translateY(-70px);
    }
    to{
        opacity:1;
        transform:translateX(-50%) translateY(0);
    }
}

@keyframes layerTop{
    from{
        opacity:0;
        transform:translateX(-50%) translateY(-65px);
    }
    to{
        opacity:1;
        transform:translateX(-50%) translateY(0);
    }
}

/* cream */

.cream{
    position:absolute;
    width:100%;
    height:10px;
    left:0;
    top:-4px;

    background:#fff2f7;
    border-radius:50%;

    box-shadow:0 3px 5px rgba(0,0,0,.1);
}

/* berries */

.berry{
    position:absolute;
    width:12px;
    height:12px;
    border-radius:50%;
    background:#7d315c;
    box-shadow:inset -2px -2px 3px rgba(0,0,0,.2);
}

.b1{left:30px;bottom:35px;}
.b2{right:30px;bottom:34px;}
.b3{left:50%;bottom:72px;transform:translateX(-50%);}

/* TITLE */

.title{
    margin-top:4px;
    min-height:58px;

    font-family:'Playfair Display',serif;
    font-size:43px;
    line-height:1.1;
}

.type{
    display:inline;
}

.cursor{
    display:inline-block;
    width:3px;
    height:38px;
    background:#fff;
    margin-left:4px;
    vertical-align:-4px;
    animation:blink .7s infinite;
}

@keyframes blink{
    50%{opacity:0;}
}

/* NAME */

.name{
    margin-top:7px;
    font-size:27px;
    font-weight:700;

    color:#f1c5df;

    text-shadow:
        0 0 20px rgba(238,163,207,.35);
}

/* MESSAGE */

.message{
    margin:17px auto 0;
    max-width:365px;

    min-height:85px;

    color:#ddd7e3;
    font-size:14px;
    line-height:1.75;
}

.message span{
    opacity:0;
    display:inline;
    animation:wordAppear .45s ease forwards;
}

@keyframes wordAppear{
    from{
        opacity:0;
        filter:blur(5px);
        transform:translateY(5px);
    }
    to{
        opacity:1;
        filter:blur(0);
        transform:translateY(0);
    }
}

/* BUTTON */

.gift{
    margin-top:16px;

    border:none;
    padding:14px 25px;

    border-radius:50px;

    font-family:inherit;
    font-size:14px;
    font-weight:700;

    color:#241729;

    background:linear-gradient(
        135deg,
        #fff,
        #f4c9e5,
        #c9c4ff
    );

    box-shadow:
        0 10px 30px rgba(220,180,240,.25);

    cursor:pointer;

    transition:.3s;
}

.gift:hover{
    transform:translateY(-4px) scale(1.03);
}

/* HIDDEN NOTE */

.note{
    display:none;
    margin-top:18px;

    padding:18px;

    border-radius:22px;

    background:rgba(255,255,255,.07);
    border:1px solid rgba(255,255,255,.12);

    color:#e8e1ea;
    font-size:13px;
    line-height:1.7;

    animation:noteIn .7s ease;
}

@keyframes noteIn{
    from{
        opacity:0;
        transform:translateY(15px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

.signature{
    margin-top:10px;
    color:#efb8d8;
    font-weight:600;
}

/* CONFETTI */

.confetti{
    position:fixed;
    top:-20px;
    width:8px;
    height:13px;
    z-index:20;

    animation:confettiFall 3.5s linear forwards;
}

@keyframes confettiFall{
    to{
        transform:
            translateY(110vh)
            rotate(720deg);
    }
}

/* FOOTER */

.footer{
    margin-top:19px;

    font-size:9px;
    letter-spacing:3px;
    color:#91899b;
}

/* MOBILE */

@media(max-width:420px){

    .card{
        padding:27px 17px 23px;
    }

    .title{
        font-size:37px;
    }

    .cake-area{
        transform:scale(.88);
        margin-top:-2px;
        margin-bottom:-10px;
    }

    .message{
        font-size:13px;
    }
}
</style>
</head>

<body>

<div class="glow one"></div>
<div class="glow two"></div>

<div class="stars"></div>

<div class="decor d1">✦</div>
<div class="decor d2">♡</div>
<div class="decor d3">✧</div>
<div class="decor d4">☆</div>

<div class="container">

<div class="card">

    <div class="from">
        a little birthday surprise
    </div>

    <div class="friend">
        for my friend ♡
    </div>

    <div class="age">
        23 years ✦
    </div>

    <!-- CAKE -->

    <div class="cake-area">

        <div class="candles">

            <div class="candle">
                <div class="flame"></div>
            </div>

            <div class="candle">
                <div class="flame"></div>
            </div>

            <div class="candle">
                <div class="flame"></div>
            </div>

        </div>

        <div class="cake">

            <div class="layer bottom">
                <div class="cream"></div>
            </div>

            <div class="layer middle">
                <div class="cream"></div>
            </div>

            <div class="layer top">
                <div class="cream"></div>
            </div>

            <div class="berry b1"></div>
            <div class="berry b2"></div>
            <div class="berry b3"></div>

            <div class="plate"></div>

        </div>

    </div>

    <!-- TYPING TITLE -->

    <div class="title">
        <span class="type" id="typing"></span>
        <span class="cursor"></span>
    </div>

    <div class="name">
        Sean ♡
    </div>

    <!-- WORD BY WORD MESSAGE -->

    <div class="message" id="message"></div>

    <button class="gift" id="giftButton" onclick="openGift()">
        open your little surprise ✦
    </button>

    <div class="note" id="note">

        Here's to another year of
        random conversations, good memories,
        stupid jokes and unforgettable moments.

        <div class="signature">
            Happy 23rd, Sean ♡
        </div>

    </div>

    <div class="footer">
        MADE ESPECIALLY FOR YOU ✦
    </div>

</div>
</div>

<script>

/* =========================
   TYPING TITLE
========================= */

const titleText = "Happy Birthday";

const typing = document.getElementById("typing");

let titleIndex = 0;

function typeTitle(){

    if(titleIndex < titleText.length){

        typing.textContent += titleText[titleIndex];

        titleIndex++;

        setTimeout(typeTitle,95);

    }else{

        startMessage();
    }
}


/* =========================
   WORD BY WORD MESSAGE
========================= */

const messageText =
"I hope this new year of your life brings you beautiful moments, good people, great music, lots of laughter and memories worth keeping.";

function startMessage(){

    const message =
        document.getElementById("message");

    const words =
        messageText.split(" ");

    words.forEach((word,index)=>{

        const span =
            document.createElement("span");

        span.textContent =
            word + " ";

        span.style.animationDelay =
            (index * 0.075) + "s";

        message.appendChild(span);

    });
}


/* =========================
   START
========================= */

setTimeout(typeTitle,900);


/* =========================
   BUTTON
========================= */

function openGift(){

    const note =
        document.getElementById("note");

    note.style.display = "block";

    document.getElementById("giftButton").textContent =
        "Happy Birthday, Sean! ♡";

    createConfetti();

}


/* =========================
   CONFETTI
========================= */

function createConfetti(){

    const colors = [
        "#ffffff",
        "#f4b7d8",
        "#c5c0ff",
        "#ffd48a",
        "#a9d9e8"
    ];

    for(let i=0;i<90;i++){

        const piece =
            document.createElement("div");

        piece.className =
            "confetti";

        piece.style.left =
            Math.random()*100 + "vw";

        piece.style.background =
            colors[
                Math.floor(
                    Math.random()*colors.length
                )
            ];

        piece.style.animationDelay =
            Math.random()*1.5 + "s";

        piece.style.transform =
            "rotate(" +
            Math.random()*360 +
            "deg)";

        document.body.appendChild(piece);

        setTimeout(()=>{
            piece.remove();
        },5000);
    }
}

</script>

</body>
</html>
